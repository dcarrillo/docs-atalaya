site_name: Atalaya
site_url: https://atalaya-docs.dcarrillo.es
site_description: Self-hosted uptime monitoring on Cloudflare Workers
repo_url: https://github.com/dcarrillo/atalaya
repo_name: dcarrillo/atalaya

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: atalaya/tower
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Regional Monitoring: regional-monitoring.md
  - Maintenance Windows: maintenance-windows.md
  - Secret Management: secret-management.md
  - Data Retention: data-retention.md
